; GARAGESENSE — garage door monitor on the Seeed XIAO ESP32S3 Sense
; Pin the platform: Arduino core 2.0.x has the stable legacy I2S PDM API
; (core 3.x changed the I2S driver and breaks it).
[env:seeed_xiao_esp32s3]
platform          = espressif32@6.9.0
board             = seeed_xiao_esp32s3
framework         = arduino
board_build.arduino.memory_type = qio_opi    ; OPI PSRAM
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1               ; Serial over native USB
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_DFU_ON_BOOT=0
upload_speed      = 115200
; --no-stub is an esptool (USB) flag: USB-JTAG desyncs on the stub baud switch.
; OTA uses espota.py, which does not know the option, so keep it per-protocol.
upload_flags      = --no-stub                 ; CRITICAL — USB-JTAG desyncs on stub baud switch
board_build.partitions = default_8MB.csv      ; 8 MB layout (app + spiffs; second app slot unused)
monitor_speed     = 115200

; Over-the-air upload. espota.py does not accept --no-stub (that is an esptool
; flag for the USB path), so this env inherits everything and clears it.
[env:ota]
extends           = env:seeed_xiao_esp32s3
upload_protocol   = espota
; clear the inherited USB flag explicitly — `extends` merges lists
upload_flags      = --auth=garagesense
upload_port       = garagesense-cba4.local
